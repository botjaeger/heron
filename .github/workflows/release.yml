# A build check for releases: builds Heron.dmg on GitHub's macOS runner with its newest released
# Xcode and keeps it as the run's artifact. It never signs or publishes anything: releases are made
# on the maintainer's Mac with scripts/release.sh, where the signing certificate and the Sparkle key
# live (docs.md › Distribution). Run it by hand (Actions › Release build › Run workflow) to see
# whether the code still builds with the older Xcode on the runners.
name: Release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number is the commit count

      - name: Use the newest released Xcode on the runner
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -iv -e beta -e rc | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Build Heron.dmg
        run: VERSION=0.0.0-dev BUILD="$(git rev-list --count HEAD)" packaging/make-dmg.sh

      - name: Keep the disk image
        uses: actions/upload-artifact@v4
        with:
          name: Heron-dmg
          path: dist/Heron.dmg
